<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Find internships by role and domain.">
  <title>Responsive Internship Board</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>Internship Board</h1>
      <p>Discover opportunities. Start your career.</p>
    </div>
  </header>

  <main class="container">
    <section class="intro" aria-labelledby="intro-title">
      <h2 id="intro-title">Find Your Internship</h2>
      <p>Explore beginner-friendly internship opportunities.</p>
    </section>

    <form id="filterForm" class="filters" role="search">
      <div class="field">
        <label for="searchInput">Search internships</label>
        <input id="searchInput" type="search" placeholder="Search by title, company, or skill">
      </div>
      <div class="field">
        <label for="domainFilter">Choose domain</label>
        <select id="domainFilter">
          <option value="all">All domains</option>
          <option value="Full Stack">Full Stack</option>
          <option value="Python">Python</option>
          <option value="Data Science">Data Science</option>
          <option value="UI/UX Design">UI/UX Design</option>
        </select>
      </div>
      <button type="submit">Search</button>
      <button type="button" id="resetButton" class="button-secondary">Reset</button>
    </form>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <section aria-labelledby="resultsHeading">
      <h2 id="resultsHeading">Available Internships</h2>
      <div id="internshipList" class="internship-list"></div>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>Internship Board · Beginner Web Development Project</p>
    </div>
  </footer>
</body>
</html>
